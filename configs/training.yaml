model:
  name: "Qwen/Qwen2.5-7B"
  use_lora: true
  lora_rank: 16
  lora_alpha: 32

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  epochs: 3
  max_seq_length: 2048

reward:
  schema_validation: true
  ast_check: true
  tool_call_match: true

logging:
  output_dir: "outputs/run_001"
  use_wandb: false
